name: Meja Depan

# Uji di setiap pull request; pasang worker setiap ada perubahan meja-depan/ di main.
# Rahasia diambil dari GitHub repository secrets dan dipasang ke worker di sini;
# nilainya tidak pernah ditulis ke berkas.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'meja-depan/**'
      - '.github/workflows/meja-depan.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  uji:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meja-depan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meja-depan/package-lock.json
      - run: npm ci
      - run: npm run periksa
      - run: npm test
      - run: npm run cek-bundel

  # Tes end-to-end: Chromium + situs hasil build + worker (layanan luar ditiru).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            meja-depan/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: meja-depan
      - run: npx playwright install --with-deps chromium
        working-directory: meja-depan
      - run: npm run e2e
        working-directory: meja-depan

  # Pastikan situs Pyonkuro tetap bisa dibangun sebelum PR digabung.
  situs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  pasang:
    needs: [uji, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: meja-depan-pasang
      cancel-in-progress: false
    defaults:
      run:
        working-directory: meja-depan
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cek rahasia Cloudflare
        id: cek
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN atau CLOUDFLARE_ACCOUNT_ID belum ada di repository secrets; worker tidak dipasang."
            echo "ada=0" >> "$GITHUB_OUTPUT"
          else
            echo "ada=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cek.outputs.ada == '1'
        uses: actions/checkout@v4
      - if: steps.cek.outputs.ada == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meja-depan/package-lock.json
      - if: steps.cek.outputs.ada == '1'
        run: npm ci
      - if: steps.cek.outputs.ada == '1'
        name: Pasang worker
        run: npx wrangler deploy
      - if: steps.cek.outputs.ada == '1'
        name: Pasang rahasia worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for nama in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TURNSTILE_SECRET_KEY RESEND_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${!nama}" ]; then
              printf '%s' "${!nama}" | npx wrangler secret put "$nama" > /dev/null
              echo "$nama: terpasang"
            else
              echo "::notice::$nama belum ada di repository secrets; dilewati."
            fi
          done
