<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pyonkuro">
  <title>Pyonkuro</title>
  <defs>
    <clipPath id="chip"><circle cx="256" cy="256" r="236"/></clipPath>
  </defs>
  <!-- badan chip -->
  <circle cx="256" cy="256" r="236" fill="#151515"/>
  <!-- 8 kotak tepi chip -->
  <g fill="#C9A24D" clip-path="url(#chip)">
    <rect x="236" y="14" width="40" height="58" id="notch"/>
    <use href="#notch" transform="rotate(45 256 256)"/>
    <use href="#notch" transform="rotate(90 256 256)"/>
    <use href="#notch" transform="rotate(135 256 256)"/>
    <use href="#notch" transform="rotate(180 256 256)"/>
    <use href="#notch" transform="rotate(225 256 256)"/>
    <use href="#notch" transform="rotate(270 256 256)"/>
    <use href="#notch" transform="rotate(315 256 256)"/>
  </g>
  <!-- garis tepi luar -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#C9A24D" stroke-width="5"/>
  <!-- cincin dalam -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="#C9A24D" stroke-width="7"/>
  <!-- kelinci -->
  <g fill="#C9A24D">
    <path d="M214 246 C210 208 212 172 223 150 C236 170 248 208 250 246 Z"/>
    <path d="M262 246 C264 208 276 170 290 150 C300 172 302 208 298 246 Z"/>
    <circle cx="256" cy="300" r="72"/>
  </g>
</svg>
