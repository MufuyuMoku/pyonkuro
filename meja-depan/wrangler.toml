# Worker Meja Depan. Dipasang oleh .github/workflows/meja-depan.yml;
# rahasia dipasang dari GitHub repository secrets, tidak pernah ditulis di sini.
name = "meja-depan"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Tanpa penyimpanan log permintaan di Cloudflare (data klien seminimal mungkin).
[observability]
enabled = false

# Penghitung batas kiriman per IP (dan batas AI harian). Durable Object berbasis
# SQLite tersedia di paket gratis dan tidak perlu dibuat manual.
[[durable_objects.bindings]]
name = "PENGHITUNG"
class_name = "Penghitung"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Penghitung"]
